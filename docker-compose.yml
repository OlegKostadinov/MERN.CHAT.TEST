services:

  mongodb:
   image: mongodb/mongodb-enterprise-server
   container_name: chatdata
   ports: 
    - 27018:27017
   environment:
     MONGO_INITDB_ROOT_USERNAME: admin
     MONGO_INITDB_ROOT_PASSWORD: supersecret

  mongo-express:
   image: mongo-express
   container_name: uichatdata
   ports: 
     - 8082:8081
   environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: supersecret
      ME_CONFIG_MONGODB_SERVER: mongodb
   depends_on:
    - "mongodb"

  chatapp:
   image: mern_chat-chatapp
      
       
    
   container_name: app_chat
   ports: 
     - 3003:3003
   environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: supersecret
      ME_CONFIG_MONGODB_SERVER: mongodb
   depends_on:
    - "mongodb"

   
   
